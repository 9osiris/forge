<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>forge - 9osiris</title>
<meta name="description" content="osiris's personal code forge. every repo, every commit, every file.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2306080d'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23f5f5f7' font-family='monospace' font-weight='bold'>f</text></svg>">

<body>
<div id="bg"></div>
<header id="topbar">
  <div class="tb-inner">
    <a href="#/" class="logo"><span class="logo-mark">f</span><span>forge</span><span class="logo-sub">9osiris</span></a>

      <span class="kbd-hint">/</span>

    </div>

      <button class="icon-btn" id="paletteBtn" title="command palette (cmd+k)">

      </a>
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main id="app"><div class="loading"><div class="spinner"></div><p>loading the forge...</p></div></main>

<footer id="foot">
  <div class="foot-inner">
    <span>forge · built by osiris</span>
    <span class="foot-links">
      <a href="https://osiris.rocks" target="_blank" rel="noopener">osiris.rocks</a>
      <a href="https://mule.osiris.rocks" target="_blank" rel="noopener">mule</a>
      <a href="https://lab.osiris.rocks" target="_blank" rel="noopener">lab</a>
      <a href="https://github.com/9osiris" target="_blank" rel="noopener">github</a>
    </span>
  </div>
</footer>

<div id="palette" class="palette-hidden">
  <div class="palette-box">
    <input id="paletteInput" type="text" placeholder="type a repo or file name..." autocomplete="off" spellcheck="false">
    <div id="paletteResults"></div>
    <div class="palette-foot"><span><b>↑↓</b> navigate</span><span><b>↵</b> open</span><span><b>esc</b> close</span></div>
  </div>
</div>

<div id="toast"></div>

<script src="js/markdown.js"></script>
<script src="js/highlight.js"></script>

</body>
</html>
